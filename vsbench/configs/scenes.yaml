# --- The historical narrow start sampler's numbers (`vssim.starts.NARROW`) ---
# Kept here because `SceneSpec` loaders read them; the sampler lives in
# `vssim.starts.sample_narrow` and the frozen files in benchmark/starts/.
  # ------------------------------------------------------------------ added 2026-09-20
  # The instance-generalisation scene (owner request): ONE Google-Scanned-Objects shoe
  # lying flat on the cluttered2 wood floor, laces up (`pre_rot_x_deg: -90` lays the
  # canonicalised scan down), analytic pose (no settle, no bake: deterministic), framed
  # at 85 % from straight above -> goal distance 0.383 m (near the posters' 0.434 m).
  # The goal picture always shows THIS shoe; the `swap_instance` perturbation puts
  # another shoe at the same pose for the flight (vssim.bench.perturb).
  shoe1:
    kind: multi_object
    description: >
      Instance generalisation: one GSO shoe (Great Jones wingtip, scan 1) flat on the
      cluttered2 wood floor; other shoe instances are swapped in at the same pose by
      the swap_instance perturbation.
    ground:
      texture: /workspace/assets/cluttered2/ground.png
      asset_id: texture/polyhaven/wood_table_001
      size_m: 2.4
      tile_period_m: 2.4
    objects:
      - {category: shoe, instance_id: gso_Great_Jones_Wingtip, dx: 0.00, dy: 0.00, pre_rot_x_deg: -90}
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    ransac: fundamental

  # ------------------------------------------------------------------ added 2026-09-22
  # shoe1 with the shoe turned 90 deg about the vertical: it lies along the image's long
  # axis, so the 85 % framing brings the goal camera closer and the shoe fills far more
  # of the picture (owner request). Same shoe, same floor, same swap machinery.
  shoe2:
    kind: multi_object
    description: >
      Instance generalisation, close framing: the GSO wingtip (scan 1) flat on the
      cluttered2 wood floor, turned 90 deg so it lies along the image width.
    ground:
      texture: /workspace/assets/cluttered2/ground.png
      asset_id: texture/polyhaven/wood_table_001
      size_m: 2.4
      tile_period_m: 2.4
    objects:
      - {category: shoe, instance_id: gso_Great_Jones_Wingtip, dx: 0.00, dy: 0.00, pre_rot_x_deg: -90, yaw_deg: 90}
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    ransac: fundamental

  # ======================================================== added 2026-09-23 (instance suite)
  # The INSTANCE SUITE (owner 2026-09-23; picks shown in the workspace page
  # docs/instance_suite_picks_2026-09-23.md, revision 2): six kinds of object - GEN-VS's six
  # (shoe, bottle, teapot, drill, mug, hammer) - one object alone on the cluttered2 wood,
  # seen straight from above at 85 % frame fill. Two scenes per kind: `inst_<kind>` shows
  # the BIG object in the goal picture, `inst_<kind>_rev` the SMALL one. The world the
  # camera then flies in is one of the scene's named `live:` objects, put in the goal
  # object's place by the perturbation `swap:@<name>` (vssim.bench.perturb), on the
  # concrete floor (`+ground:concrete`). Live names - forward: `same` (the check),
  # `same_small` (the goal object at the small size), `other_small` (the other object at
  # its real small size), `mine1`/`mine2` (the mug also `mine3`: `025_mug`, GEN-VS's mug
  # TRAIN reference, not held out) and `gen1..` (other objects of the kind scaled to the
  # goal's size; `gen*` = GEN-VS's held-out set, gen-vs configs/eval/heldout_split_v2.yaml);
  # reverse: `same`, `same_big`, `other_big`.
  # `placement:` states each kind's orientation once (vssim.scenes.placed_item): the asset
  # library's upright canonical pose (`canonical: library` = Rz(yaw_pick) * R_orient(pick),
  # the GEN-VS renderer's), then `pre_rot_x_deg` (a lay-down about world X), then `yaw_deg`
  # (`long_axis_x` = turned so the object lies along the frame's width). `size_m` is the
  # longest extent after that orientation - real sizes where the scan is metric (shoes,
  # teapots, mugs, hammers), stated real-world sizes where the model has no units (bottles:
  # 1.5 L = 0.31 m, 0.5 L = 0.205-0.21 m; drills: 0.24 m and a 0.16 m compact driver).
  # The object lists live HERE and only here: edit a `live:` entry to swap an object.

  inst_shoe:
    kind: multi_object
    description: >
      Instance suite (forward): the goal picture shows Reebok running shoe, 29.3 cm;
      live objects under `live:`. Placement: flat on its sole, laces up, toe to the
      left (the library's upright canonical pose), long axis along the image width.
    ground:
      texture: /workspace/assets/cluttered2/ground.png
      asset_id: texture/polyhaven/wood_table_001
      size_m: 2.4
      tile_period_m: 2.4
    placement: {canonical: library, yaw_deg: long_axis_x}
    objects:
      - {category: shoe, instance_id: Reebok_SOMERSET_RUN, dx: 0.0, dy: 0.0, size_m: 0.293}
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    prompt: shoe
    ransac: fundamental
    live:
      same:        {instance_id: Reebok_SOMERSET_RUN, size_m: 0.293}   # the same
      same_small:  {instance_id: Reebok_SOMERSET_RUN, size_m: 0.217}   # the same at 21.7 cm
      other_small: {instance_id: gso_Reebok_BREAKPOINT_LO_2V, size_m: 0.217}   # Reebok kids' shoe (velcro), 21.7 cm
      mine1:       {instance_id: ASICS_GELChallenger_9_Royal_BlueWhiteBlack, size_m: 0.293}   # ASICS running shoe (scaled to 29.3 cm)
      mine2:       {instance_id: Mens_ASV_Billfish_Boat_Shoe_in_Tan_Leather_wmUJ5PbwANc, size_m: 0.293}   # tan boat shoe (scaled to 29.3 cm)
      gen1:        {instance_id: SUPERSTAR_CLR, size_m: 0.293}   # adidas Superstar (scaled to 29.3 cm)
      gen2:        {instance_id: gso_ASICS_GELTour_Lyte_WhiteOrchidSilver, size_m: 0.293}   # ASICS white/pink (scaled to 29.3 cm)
      gen3:        {instance_id: gso_Mens_ASV_Billfish_Boat_Shoe_in_Dark_Brown_Leather_zdHVHXueI3w, size_m: 0.293}   # dark brown boat shoe (scaled to 29.3 cm)
      gen4:        {instance_id: gso_Mens_Gold_Cup_ASV_2Eye_Boat_Shoe_in_Cognac_Leather, size_m: 0.293}   # cognac boat shoe (scaled to 29.3 cm)
      gen5:        {instance_id: gso_Reebok_CL_DIBELLO_II, size_m: 0.293}   # Reebok high-top (scaled to 29.3 cm)
      gen6:        {instance_id: gso_TZX_Runner, size_m: 0.293}   # purple runner (scaled to 29.3 cm)

  inst_shoe_rev:
    kind: multi_object
    description: >
      Instance suite (reverse): the goal picture shows Reebok kids' shoe (velcro),
      21.7 cm;
      live objects under `live:`. Placement: flat on its sole, laces up, toe to the
      left (the library's upright canonical pose), long axis along the image width.
    ground:
      texture: /workspace/assets/cluttered2/ground.png
      asset_id: texture/polyhaven/wood_table_001
      size_m: 2.4
      tile_period_m: 2.4
    placement: {canonical: library, yaw_deg: long_axis_x}
    objects:
      - {category: shoe, instance_id: gso_Reebok_BREAKPOINT_LO_2V, dx: 0.0, dy: 0.0, size_m: 0.217}
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    prompt: shoe
    ransac: fundamental
    live:
      same:        {instance_id: gso_Reebok_BREAKPOINT_LO_2V, size_m: 0.217}   # the same
      same_big:    {instance_id: gso_Reebok_BREAKPOINT_LO_2V, size_m: 0.293}   # the same at 29.3 cm
      other_big:   {instance_id: Reebok_SOMERSET_RUN, size_m: 0.293}   # Reebok running shoe, 29.3 cm

  inst_bottle:
    kind: multi_object
    description: >
      Instance suite (forward): the goal picture shows evian 1.5 L (clear), 31 cm;
      live objects under `live:`. Placement: the upright bottle laid on its side (90
      deg about world X), cap to the right, long axis along the image width.
    ground:
      texture: /workspace/assets/cluttered2/ground.png
      asset_id: texture/polyhaven/wood_table_001
      size_m: 2.4
      tile_period_m: 2.4
    placement: {canonical: library, pre_rot_x_deg: 90, yaw_deg: long_axis_x}
    objects:
      - {category: bottle, instance_id: objv_affd4ebf5fd1, dx: 0.0, dy: 0.0, size_m: 0.31}
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    prompt: bottle
    ransac: fundamental
    live:
      same:        {instance_id: objv_affd4ebf5fd1, size_m: 0.31}   # the same
      same_small:  {instance_id: objv_affd4ebf5fd1, size_m: 0.205}   # the same at 20.5 cm
