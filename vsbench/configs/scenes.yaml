# The scenes.
#
# Six BENCHMARK scenes come first (`vssim.scenes.EVAL_SCENES` names them in this
# order); the "additional scenes" section at the end holds older probe scenes that
# still build and that no benchmark start file exists for.
#
# Working distances are NEVER tabulated here — they are derived at build time from
# `configs/camera.yaml` against each scene's extent (posters: `fill_frame` from the
# plate size; rooms: `scene_view` from the MEASURED bounding box of the placed
# objects). Every geometric value below is frozen: the frozen start files in
# `benchmark/starts/` were built against the goal poses these values produce, and
# `vssim.benchmark.check_scene_goal` refuses a scene whose goal drifted.
#
# Heavy data is NOT in git. Textures are absolute paths on the station volume
# (`/workspace/assets/...`); object USDs resolve through `$VSSIM_ASSET_ROOT`
# (curated library ids) and `$VSSIM_YCB_ROOT` (`ycb/...` ids). See benchmark/README.md.

version: 1

# How the GOAL view is captured: `render_warmup_steps` is the number of whole goal
# captures taken, of which `goal_capture_keep` (`last`) is kept; 1 = no warm-up.
# Required, no default in code (`vssim.scenes.goal_capture_settings`). EIGHT because
# the first RTX capture after a pose change still carries render history: on the
# station the third capture still differed from the second by 0.56–0.59 grey levels
# and the brightness was still climbing at the fourth (settle experiment, 2026-09-05;
# ruled 2026-09-06).
scene:
  render_warmup_steps: 8
  goal_capture_keep: last

scenes:

  # ===================================================================== posters
  # Three 0.8 x 0.6 m textured plates in the world XY plane, seen fronto-parallel
  # from +Z. The goal camera COVERS the frame with poster (coverage 1.35 leaves
  # margin so a perturbed start still sees only poster) — the ART-VS Gazebo
  # benchmark's framing. A mid-grey backdrop replaces the void at wide starts and
  # adds no matchable structure of its own.

  hollywood:
    kind: poster
    description: >
      Planar textured target reproducing the ART-VS Gazebo poster benchmark.
      A plane is well-posed for homography-based classical IBVS, so ORB/SIFT
      converging here is a genuine correctness check for those baselines.
    # Geometry recovered from ART-VS/catkin_ws/ibvs/models/viso/meshes/resized.dae:
    # positions span x[-0.4,0.4], z[-0.3,0.3], y[+-0.005].
    width_m: 0.8
    height_m: 0.6
    thickness_m: 0.01
    # The texture is not committed (third-party artwork). Staged on the volume.
    texture: /workspace/assets/hollywood/resized.png
    backdrop:
      size_m: 4.0
      gray: 0.5
    goal:
      kind: fill_frame
      coverage: 1.35
    ransac: homography        # correct model for a planar target

  poster2:
    kind: poster
    description: >
      Identical geometry to `hollywood` with a DIFFERENT texture (a held-out
      COCO photo, staged on the volume). The scene-specificity guard: a method
      tuned to hollywood rather than to the task degrades here.
    width_m: 0.8
    height_m: 0.6
    thickness_m: 0.01
    texture: /workspace/assets/poster2/poster2.png
    texture_asset_id: texture/coco/000000000724
    backdrop:
      size_m: 4.0
      gray: 0.5
    goal:
      kind: fill_frame
      coverage: 1.35
    ransac: homography

  poster3:
    kind: poster
    description: >
      Never-seen planar scene. Identical geometry to hollywood/poster2 with a
      texture from a source outside every training pool: Pieter Bruegel's "The
      Tower of Babel" (Vienna), public domain, Wikimedia Commons, 3840x2810
      (well above the camera's sampling density). Never previewed; zero tuning.
    width_m: 0.8
    height_m: 0.6
    thickness_m: 0.01
    texture: /workspace/assets/poster3/poster3.jpg
    backdrop:
      size_m: 4.0
      gray: 0.5
    goal:
      kind: fill_frame
      coverage: 1.35
    ransac: homography

  # ======================================================================= rooms
  # Objects on a textured, non-repeating 2.4 m ground (tile_period_m == size_m).
  # The goal frames the MEASURED bounding box of everything placed from straight
  # above (`scene_view`, frame_fill 0.85, elevation 90). Object resting poses were
  # gravity-settled ONCE and frozen to `layout_file` — a re-settle may never define
  # a goal (PhysX is not bit-stable across processes).

  industrial1_drill:
    kind: multi_object
    description: >
      Industrial single-object scene: ONE HANDAL drill instance lying on its side
      on a non-repeating concrete floor — genuinely non-planar.
    ground:
      texture: /workspace/assets/industrial1/ground.png
      asset_id: texture/concrete042d
      size_m: 2.4
      tile_period_m: 2.4        # single span — never repeats
    objects:
      - {category: drill, instance_id: handal_drill_25, dx: 0.00, dy: 0.00}
    settle:
      # Gravity on; the drill LIES on its side — dropped at exactly 90° tilt
      # (random yaw, seeded). The settled pose is frozen in `layout_file`.
      seed: 20260821
      tilt_deg: 90
      drop_m: 0.05
      steps: 240
    layout_file: configs/layouts/industrial1_drill.json
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    ransac: fundamental

  cluttered2:
    kind: multi_object
    description: >
      Cluttered scene of EXTERNAL objects (YCB google_16k scans, metric — placed
      at native scale) on an external Polyhaven ground texture, single span.
      Eight objects in a seeded scatter; the tall pitcher is placed upright and
      held static while the others settle around it.
    ground:
      texture: /workspace/assets/cluttered2/ground.png
      asset_id: texture/polyhaven/wood_table_001
      size_m: 2.4
      tile_period_m: 2.4        # single span — never repeats
    objects:
      # Positions come from the seeded `scatter` sampler; the item list fixes
      # WHICH objects and their order.
      - {category: ycb, instance_id: ycb/003_cracker_box}
      - {category: ycb, instance_id: ycb/004_sugar_box}
      - {category: ycb, instance_id: ycb/005_tomato_soup_can}
      - {category: ycb, instance_id: ycb/008_pudding_box}
      - {category: ycb, instance_id: ycb/010_potted_meat_can}
      - {category: ycb, instance_id: ycb/011_banana}
      # settle: false — the handle-heavy pitcher topples from ANY drop; the tallest
      # object must stand, so it is placed upright and held static (with collider)
      # while the others settle around it.
      - {category: ycb, instance_id: ycb/019_pitcher_base, settle: false,
         pre_rot_x_deg: -90}  # the native scan LIES, mouth at -Y: Rx(-90) stands it mouth-UP
      - {category: ycb, instance_id: ycb/024_bowl}
    scatter:
      seed: 20260821
      # Aspect-matched to the 16:9 goal frame (image-right = world +X): a square
      # scatter always leaves the frame's left/right thirds empty.
      half_extent_x_m: 0.62
      half_extent_y_m: 0.35
      min_dist_m: 0.22          # spacing enforced at the drop positions
    settle:
      # Gravity on — natural resting poses; a gentle initial tilt (≤ 5°) so boxes,
      # cans and the pitcher land upright and the scene keeps a big depth spread.
      seed: 20260821
      tilt_max_deg: 5
      drop_m: 0.04
      steps: 240
    layout_file: configs/layouts/cluttered2.json
    goal:
      kind: scene_view
      frame_fill: 0.85
      elevation_deg: 90
    ransac: fundamental

  cluttered3:
    kind: multi_object
    description: >
      Never-seen cluttered scene: the same YCB pool minus the pitcher (its
      cluttered2 settle special-case was hand-tuned), i.e. seven external scans
      in a FRESH seeded scatter+settle on a FRESH external Polyhaven ground
      (laminate_floor_02). Scatter/settle constants are cluttered2's verbatim;
      only the seed is new. Layout baked headlessly before any episode.
    ground:
      texture: /workspace/assets/cluttered3/ground.png
      asset_id: texture/polyhaven/laminate_floor_02
      size_m: 2.4
      tile_period_m: 2.4        # single span — never repeats
    objects:
      - {category: ycb, instance_id: ycb/003_cracker_box}
      - {category: ycb, instance_id: ycb/004_sugar_box}
      - {category: ycb, instance_id: ycb/005_tomato_soup_can}
      - {category: ycb, instance_id: ycb/008_pudding_box}
      - {category: ycb, instance_id: ycb/010_potted_meat_can}
      - {category: ycb, instance_id: ycb/011_banana}
      - {category: ycb, instance_id: ycb/024_bowl}
    scatter:
      seed: 20260827
      half_extent_x_m: 0.62
      half_extent_y_m: 0.35
      min_dist_m: 0.22
    settle:
      seed: 20260827
      tilt_max_deg: 5
      drop_m: 0.04
      steps: 240
    layout_file: configs/layouts/cluttered3.json
    goal:
      kind: scene_view
      frame_fill: 0.85          # cluttered2's value, verbatim
      elevation_deg: 90         # cluttered2's value, verbatim
    ransac: fundamental

  # ========================================================= additional scenes
  # Older probe scenes. They build (their objects are in assets/asset_library_v2.json
  # and their textures are on the volume) but NO benchmark start file exists for
  # them and they are not in `EVAL_SCENES`. Analytic placement, no settle, no
  # layout: the objects stand upright at their (dx, dy) offsets.
  #
  # objects1 and its two variants: five curated held-out instances on a TILED
  # gravel ground (0.6 m period ⇒ ~2 copies visible; the p12/p24 variants stretch
  # the same texture to 1.2 m and 2.4 m periods — the tiling-ambiguity dose-response).
  # bottle1 / mug1: one symmetric (bottle) or near-symmetric (mug) object filling
  # the goal frame; bottle1p / mug1p: the same with a flat mid-grey ground (RGB 128,
  # generated on the volume — no library asset behind it) as the ground-confound
  # control.

  objects1:
    kind: multi_object
    description: >
      Five curated held-out instances on a tiled gravel ground (0.6 m period).
    ground:
      texture: /workspace/assets/objects1/ground.png
      asset_id: texture/gravel038
      size_m: 2.4
      tile_period_m: 0.6
    objects:
      - {category: bottle, instance_id: 7c46341c63f0495c89d6871429dad261, dx:  0.00, dy:  0.00}
      - {category: drill,  instance_id: 1ef6b1c978ee4d7dacd3752d28b631c5, dx:  0.20, dy:  0.12}
      - {category: hammer, instance_id: handal_hammer_06,                 dx: -0.19, dy:  0.14}
      - {category: mug,    instance_id: de23895b6e9b4cfd870e30d14c2150dd, dx:  0.04, dy: -0.20}
      - {category: shoe,   instance_id: Reebok_SOMERSET_RUN,              dx: -0.18, dy: -0.13}
    goal:
      kind: scene_view
      frame_fill: 0.70
    ransac: fundamental

  objects1_p12:
    kind: multi_object
    description: >
      objects1 with the ground texture repeated every 1.2 m. Geometry identical.
    ground:
      texture: /workspace/assets/objects1/ground.png
      asset_id: texture/gravel038
      size_m: 2.4
      tile_period_m: 1.2
    objects:
      - {category: bottle, instance_id: 7c46341c63f0495c89d6871429dad261, dx:  0.00, dy:  0.00}
      - {category: drill,  instance_id: 1ef6b1c978ee4d7dacd3752d28b631c5, dx:  0.20, dy:  0.12}
      - {category: hammer, instance_id: handal_hammer_06,                 dx: -0.19, dy:  0.14}
      - {category: mug,    instance_id: de23895b6e9b4cfd870e30d14c2150dd, dx:  0.04, dy: -0.20}
      - {category: shoe,   instance_id: Reebok_SOMERSET_RUN,              dx: -0.18, dy: -0.13}
    goal:
      kind: scene_view
      frame_fill: 0.70
    ransac: fundamental

  objects1_p24:
    kind: multi_object
    description: >
      objects1 with the ground texture stretched once across the 2.4 m floor
      (no repetition). Geometry identical.
    ground:
      texture: /workspace/assets/objects1/ground.png
      asset_id: texture/gravel038
      size_m: 2.4
      tile_period_m: 2.4
    objects:
      - {category: bottle, instance_id: 7c46341c63f0495c89d6871429dad261, dx:  0.00, dy:  0.00}
      - {category: drill,  instance_id: 1ef6b1c978ee4d7dacd3752d28b631c5, dx:  0.20, dy:  0.12}
      - {category: hammer, instance_id: handal_hammer_06,                 dx: -0.19, dy:  0.14}
      - {category: mug,    instance_id: de23895b6e9b4cfd870e30d14c2150dd, dx:  0.04, dy: -0.20}
      - {category: shoe,   instance_id: Reebok_SOMERSET_RUN,              dx: -0.18, dy: -0.13}
    goal:
      kind: scene_view
      frame_fill: 0.70
    ransac: fundamental

  bottle1:
    kind: multi_object
    description: >
      A single bottle (every roll angle image-equivalent up to the cap/label
      micro-structure) on the objects1 gravel ground.
    ground:
      texture: /workspace/assets/objects1/ground.png
      asset_id: texture/gravel038
      size_m: 2.4
      tile_period_m: 0.6
    objects:
      - {category: bottle, instance_id: 7c46341c63f0495c89d6871429dad261, dx: 0.00, dy: 0.00}
    goal:
      kind: scene_view
      frame_fill: 0.88
    ransac: fundamental

  mug1:
    kind: multi_object
    description: >
      A single mug whose handle is a large asymmetric feature, always visible
      from the top-down goal view.
    ground:
      texture: /workspace/assets/objects1/ground.png
      asset_id: texture/gravel038
      size_m: 2.4
      tile_period_m: 0.6
    objects:
      - {category: mug, instance_id: de23895b6e9b4cfd870e30d14c2150dd, dx: 0.00, dy: 0.00}
    goal:
      kind: scene_view
      frame_fill: 0.88
    ransac: fundamental

  bottle1p:
    kind: multi_object
    description: >
      bottle1 with a flat mid-grey ground (RGB 128). Geometry identical to bottle1.
    ground:
      texture: /workspace/assets/wpc/gray128.png
      size_m: 2.4
      tile_period_m: 0.6
    objects:
      - {category: bottle, instance_id: 7c46341c63f0495c89d6871429dad261, dx: 0.00, dy: 0.00}
    goal:
      kind: scene_view
      frame_fill: 0.88
    ransac: fundamental

  mug1p:
    kind: multi_object
    description: >
      mug1 with a flat mid-grey ground (RGB 128). Geometry identical to mug1.
    ground:
      texture: /workspace/assets/wpc/gray128.png
      size_m: 2.4
      tile_period_m: 0.6
    objects:
      - {category: mug, instance_id: de23895b6e9b4cfd870e30d14c2150dd, dx: 0.00, dy: 0.00}
    goal:
      kind: scene_view
