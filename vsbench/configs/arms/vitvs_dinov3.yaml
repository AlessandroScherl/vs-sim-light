# ViT-VS on DINOv3 — the published dense baseline, RANSAC-free.
#
# It needs no code of its own: it IS `vssim.baselines.match.DenseMatcher` on the
# DINOv3 ViT-S/16 backbone. Stating it as its own file is what keeps a published
# baseline's cell from being assembled by hand at report time.
#
# RANSAC-free: `DenseMatcher` has no ransac knob at all, so the column cannot be
# turned on by accident.

seed: 20260902

matcher:
  variant: mutual_nn_seeded_subsample
  device: cuda                     # stated, no default (cpu in the fast tier)
  backbone_name: dinov3_vits16     # 512 input, patch 16, 32x32x384 (vssim.baselines.features)
  num_landmarks: 24                # the published K
  tie_order: stable
  threshold: 1.0

controller:
  gain: 2.0
  dt: 0.016666666666666666
  solve_unrounded: true            # sub-pixel on every arm
  ema_alpha: 0.0
  weighting:                       # published ViT-VS is unweighted
    use_trust: false
    use_margin: false
    per_axis: false

stop:
  rule: cns_plateau

episode:
  max_iter: 600
  divergence_abort: true
  record_stops: [velocity_quiet, dec_plateau]
  telemetry_extended: false

scoring:
  success_rule: [predicate_a, paper_3cm_3deg, cns_code_0p1d_10deg, abs_10mm_1deg, abs_20mm_2deg, abs_50mm_5deg, abs_100mm_10deg]
