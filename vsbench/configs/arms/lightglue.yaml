# SuperPoint + LightGlue + IBVS - the learned SPARSE matcher (Lindenberger et al.,
# ICCV 2023), the authors' own package, into the same unweighted IBVS law and the same
# RANSAC switch as the classical detectors (`classical.yaml`).
#
# Two columns, like the classical arms: `ransac: scene_default` (the scene's own
# geometric model, LightGlue's own evaluation pairs it with RANSAC) and `ransac: none`.
# `num_landmarks: 24` keeps the best 24 matches by LightGlue's confidence, so the
# controller steers on the same count as every other arm; `0` steers on every match
# (a stated option, not the arm). `resize: 1024` is the package's and the paper's
# long-edge setting; `null` runs SuperPoint at native 1920.
#
# WEIGHTS: `superpoint_v1.pth` and `superpoint_lightglue_v0-1_arxiv.pth` in
# `$TORCH_HOME/hub/checkpoints`, md5-checked at build; never downloaded by a run.
# PACKAGE: github.com/cvg/LightGlue @ eb42fee2 (`pip install --no-deps`), kornia beside it.

seed: 20260902

matcher:
  variant: lightglue
  device: cuda                     # stated, no default (cpu in the fast tier)
  num_landmarks: 24
  ransac: scene_default            # the with-RANSAC column; `none` is the other one
  ransac_thresh_px: 3.0
  max_num_keypoints: 2048          # the paper's evaluation budget
  detection_threshold: 0.0005
  nms_radius: 4
  resize: 1024                     # the package default; null = native 1920
  filter_threshold: 0.1
  depth_confidence: 0.95
  width_confidence: 0.99

controller:
  gain: 2.0
  dt: 0.016666666666666666
  solve_unrounded: true
  ema_alpha: 0.0
  weighting:                       # a keypoint matcher: unweighted, like the classical arms
    use_trust: false
    use_margin: false
    per_axis: false

stop:
  rule: cns_plateau

episode:
  max_iter: 600
  divergence_abort: true
  record_stops: [velocity_quiet, dec_plateau]
  telemetry_extended: false

scoring:
  success_rule: [predicate_a, paper_3cm_3deg, cns_code_0p1d_10deg, abs_10mm_1deg, abs_20mm_2deg, abs_50mm_5deg, abs_100mm_10deg]
