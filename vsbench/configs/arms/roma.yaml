# RoMa + IBVS - the DENSE learned matcher (Edstedt et al., CVPR 2024) into the same
# unweighted IBVS law as every other keypoint arm; the baseline CNSv2 (arXiv
# 2503.00132) compares itself against. `variant: romav2` runs RoMa v2 (arXiv
# 2511.15706) through the same wrapper.
#
# Per control step the goal picture is matched densely against the live one and
# `num_landmarks` correspondences are taken out of the warp: `sampling: sample` is
# RoMa's own certainty-weighted sampler with a seeded generator per frame (rows change
# every frame, like the ViT arms' seeded draw; a re-run draws the same rows);
# `pinned` keeps the same seeded goal pixels for the whole episode. `certainty_min`
# drops correspondences the model is unsure about before RANSAC. Two RANSAC columns
# as on the classical arms.
#
# WEIGHTS: fetched by the packages into `$TORCH_HOME/hub/checkpoints` the first time a
# model is built on a machine (roma_outdoor.pth + DINOv2 ViT-L for v1; romav2.0.1.pt +
# DINOv3 for v2, ~1 GB each) - a station stages them once; the record says whether they
# were present. PACKAGES: `pip install romatch romav2` (plus `loguru`, `einops`).

seed: 20260902

matcher:
  variant: roma                    # roma | romav2
  device: cuda                     # stated, no default (cpu in the fast tier)
  num_landmarks: 24
  sampling: sample                 # sample | pinned
  certainty_min: 0.0
  ransac: scene_default            # the with-RANSAC column; `none` is the other one
  ransac_thresh_px: 3.0

controller:
  gain: 2.0
  dt: 0.016666666666666666
  solve_unrounded: true
  ema_alpha: 0.0
  weighting:                       # unweighted, like every keypoint arm
    use_trust: false
    use_margin: false
    per_axis: false

stop:
  rule: cns_plateau

episode:
  max_iter: 600
  divergence_abort: true
  record_stops: [velocity_quiet, dec_plateau]
  telemetry_extended: false

scoring:
  success_rule: [predicate_a, paper_3cm_3deg, cns_code_0p1d_10deg, abs_10mm_1deg, abs_20mm_2deg, abs_50mm_5deg, abs_100mm_10deg]
